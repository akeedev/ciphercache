[project]
name = "2026_ai_pycoding_template"
version = "0.1.0"
description = "Template repo for spec-first, Codex-assisted Python projects"
requires-python = ">=3.12.0"
dependencies = [
    "ipykernel>=7.1.0",
    "mypy>=1.11",
    "ruff>=0.14.14",
]

[tool.setuptools]
include-package-data = true
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [
  ".git",
  ".venv",
  "venv",
  "build",
  "dist",
  "__pypackages__",
  ".mypy_cache",
  ".pytest_cache",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
